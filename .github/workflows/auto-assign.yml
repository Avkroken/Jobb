name: Auto assign issues and pull requests

on:
  issues:
    types: [opened, reopened]
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  assign-issue:
    if: ${{ github.event_name == 'issues' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Assign issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ASSIGNEE: blixten85
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg assignee "$ASSIGNEE" '{assignees: [$assignee]}')"
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<<"$payload" \
            >/dev/null

  assign-pull-request:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Assign pull request
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          ASSIGNEE: blixten85
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -cn --arg assignee "$ASSIGNEE" '{assignees: [$assignee]}')"
          gh api --method POST \
            --header "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/assignees" \
            --input - <<<"$payload" \
            >/dev/null
